; Configuration de la repartition des eleves en classes
; Les lignes commencant par ; ou # sont des commentaires.
; Toutes les cles sont optionnelles : les valeurs ci-dessous sont les valeurs par defaut.

[classes]
; Nombre de classes a former
nb_classes = 4

[algorithme]
; Parametres de l'algorithme genetique
nb_generations = 30
pop_par_gen = 500
nb_selection_par_generation = 20
nb_modif_mutation = 2
; Graine du generateur aleatoire : 0 = resultat different a chaque execution,
; toute autre valeur = resultat reproductible
graine = 0

[ponderations]
; Poids des ecarts de moyenne par matiere (Math, Lecture, Comportement)
w_math = 2
w_lecture = 2
w_comportement = 4
; Poids des ecarts de moyenne par caracteristique (Genre, Etranger)
w_genre = 10
w_etranger = 5
; Poids de l'ecart-type des notes dans chaque classe (diversite des niveaux)
w_ecart_type_notes = 0.5
; Penalite si deux eleves avec le meme numero Separe sont dans la meme classe
; (mettre une valeur tres grande pour une contrainte quasi stricte)
w_separe = 1000

[fichiers]
; Fichier CSV d'entree (colonnes : Id;Nom;Genre;Etranger;Lecture;Math;Comportement;Separe)
fichier_eleves = eleves.csv
; Prefixe des fichiers de sortie : produit classe_1.csv, classe_2.csv, ...
prefixe_sortie = classe
